<style>
:root{--bg:#ffffff;--outer:#f6f7f9;--group:#eef1f6;--part:#ffffff;--sub:#f7f9fc;--stroke:#5b6577;--text:#1b2230;--muted:#5b6577;--conn:#2563eb;--port:#f59e0b}
@media (prefers-color-scheme: dark){:root{--bg:#12151c;--outer:#171b24;--group:#1e2430;--part:#262d3b;--sub:#2d3546;--stroke:#8a94a8;--text:#e8ecf3;--muted:#a3adc0;--conn:#6ea0ff;--port:#fbbf24}}
rect.outer{fill:var(--outer);stroke:var(--stroke);stroke-width:1.5}
rect.group{fill:var(--group);stroke:var(--stroke);stroke-width:1.2}
rect.part{fill:var(--part);stroke:var(--stroke);stroke-width:1.2}
rect.sub{fill:var(--sub);stroke:var(--stroke);stroke-width:1}
.dashed{stroke-dasharray:6 4}
rect.port{fill:var(--port);stroke:var(--stroke);stroke-width:1}
polyline.conn{fill:none;stroke:var(--conn);stroke-width:2}
circle.dot{fill:var(--conn)}
text{fill:var(--text)}
text.title{font-size:14px;font-weight:600}
text.plabel{font-size:10.5px;fill:var(--muted)}
text.clabel{font-size:11.5px;font-style:italic;fill:var(--conn)}
</style>
